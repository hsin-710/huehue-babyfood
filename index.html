<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hue Hue 寶貝副食品萬年曆 & 試敏追蹤器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap');
    body { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }

<body class="text-slate-800 antialiased min-h-screen flex flex-col pb-8">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-2.5 sm:px-6 py-2 flex items-center justify-between flex-wrap gap-1.5">
      <div class="flex items-center gap-1.5">
        <span class="text-xl sm:text-2xl">👶</span>
        <div>
          <h1 class="font-bold text-base sm:text-lg text-slate-800 leading-tight">Hue Hue 試敏日誌</h1>
          <p class="text-[9px] sm:text-xs text-slate-500">雲端同步 ‧ 全家共享版</p>
        </div>
      </div>

      <!-- 視圖切換按鈕 -->
      <div class="flex items-center bg-slate-100 p-1 rounded-xl text-xs font-medium">
        <button id="viewBtnDaily" onclick="switchView('daily')" class="px-3 sm:px-4 py-1 rounded-lg transition-all flex items-center gap-1 bg-white shadow-xs text-emerald-700 font-semibold">
          <i class="fa-solid text-[10px] fa-list-ul"></i> 按日
        </button>
        <button id="viewBtnCalendar" onclick="switchView('calendar')" class="px-3 sm:px-4 py-1 rounded-lg transition-all flex items-center gap-1 text-slate-600 hover:text-slate-900">
          <i class="fa-regular text-[10px] fa-calendar-days"></i> 按月
        </button>
        <button id="viewBtnLibrary" onclick="switchView('library')" class="px-3 sm:px-4 py-1 rounded-lg transition-all flex items-center gap-1 text-slate-600 hover:text-slate-900">
          <i class="fa-solid text-[10px] fa-carrot"></i> 食材庫 <span id="libraryCountBadge" class="bg-emerald-100 text-emerald-800 text-[9px] px-1.5 py-0.2 rounded-full font-bold">0</span>
        </button>
      </div>
    </div>

    <!-- 雲端同步與工具列 -->
    <div class="bg-slate-50 border-t border-slate-100 px-2.5 sm:px-6 py-1.5">
      <div class="max-w-7xl mx-auto flex items-center justify-between text-xs text-slate-600 flex-wrap gap-1.5">
        <div class="flex items-center gap-1.5">
          <span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-lg border border-emerald-200 font-semibold text-[10px]">
            <i class="fa-solid fa-cloud text-[9px]"></i> 同步碼: <span id="syncCodeDisplay" class="font-bold">huehue</span>
          </span>
          <button onclick="promptChangeSyncCode()" class="text-slate-500 hover:text-slate-800 underline text-[10px]">修改</button>
          <span id="cloudStatusBadge" class="bg-amber-100 text-amber-800 text-[9px] px-1.5 py-0.5 rounded font-bold">連線中...</span>
        </div>

        <div class="flex items-center gap-1.5">
          <button onclick="openMealModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-xl font-bold shadow-xs transition-all flex items-center gap-1 text-xs">
            <i class="fa-solid fa-plus text-[10px]"></i> 新增餐點
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-7xl mx-auto px-2.5 sm:px-6 pt-2.5 flex-1 w-full">

    <!-- 1. 按日視圖 -->
    <section id="viewDaily" class="space-y-2.5">
      <div class="flex items-center justify-between bg-white px-3 py-2 rounded-2xl border border-slate-200 shadow-xs flex-wrap gap-1.5">
        <div class="flex items-center gap-1.5 flex-wrap">
          <button onclick="shiftDailyDate(-1)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-bold text-xs transition-all flex items-center gap-1">
            <i class="fa-solid fa-chevron-left text-[8px]"></i> 前一天
          </button>
          <input type="date" id="dailyDateFilter" onchange="renderDailyCards()" class="border border-slate-300 rounded-lg px-2 py-0.5 text-xs font-bold bg-slate-50 focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500">
          <button onclick="shiftDailyDate(1)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-bold text-xs transition-all flex items-center gap-1">
            後一天 <i class="fa-solid fa-chevron-right text-[8px]"></i>
          </button>
          <button id="btnJumpToToday" onclick="resetDailyDateToToday()" class="hidden bg-emerald-100 hover:bg-emerald-200 text-emerald-800 border border-emerald-300 px-2 py-1 rounded-lg font-extrabold text-xs transition-all flex items-center gap-1 shadow-xs">
            <i class="fa-solid fa-rotate-left text-[9px]"></i> 今日
          </button>
        </div>
      </div>
      <div id="dailyCardsContainer" class="space-y-2"></div>
    </section>

    <!-- 2. 按月視圖 -->
    <section id="viewCalendar" class="hidden space-y-3">
      <div class="bg-white p-3 sm:p-5 rounded-2xl border border-slate-200 shadow-xs">
        <div class="flex items-center justify-between mb-3">
          <button onclick="changeMonth(-1)" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 text-xs font-bold transition-all"><i class="fa-solid fa-chevron-left"></i> 上個月</button>
          <h2 id="calendarMonthTitle" class="text-base sm:text-xl font-extrabold text-slate-800">2026 年 8 月</h2>
          <button onclick="changeMonth(1)" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 text-xs font-bold transition-all">下個月 <i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center font-bold text-slate-600 text-xs py-1.5 border-b border-slate-200 bg-slate-50/80 rounded-t-xl">
          <div class="text-rose-600">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="text-emerald-700">六</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1 mt-1.5"></div>
      </div>
    </section>

    <!-- 3. 食材庫視圖 -->
    <section id="viewLibrary" class="hidden space-y-2.5">
      <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-xs space-y-2">
        <div class="flex items-center justify-between flex-wrap gap-1.5">
          <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1"><span>🥦</span> 食材解鎖圖鑑</h2>
          <div class="flex items-center gap-1 text-[11px]">
            <span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold" id="unlockedStatsText">解鎖 0 / 100+ 種</span>
            <span class="bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full font-bold" id="allergyStatsText">❌ 過敏 0 種</span>
          </div>
        </div>
        <div class="flex items-center gap-1 overflow-x-auto pb-0.5 custom-scrollbar text-xs font-medium">
          <button onclick="filterLibraryCategory('all')" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-bold whitespace-nowrap shadow-xs">全部食材</button>
          <button onclick="filterLibraryCategory('穀物澱粉')" class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap">🌾 穀物</button>
          <button onclick="filterLibraryCategory('蔬菜菌菇')" class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap">🥦 蔬菜</button>
          <button onclick="filterLibraryCategory('水果')" class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap">🍎 水果</button>
          <button onclick="filterLibraryCategory('蛋豆魚肉乳')" class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap">🥩 蛋白</button>
          <button onclick="filterLibraryCategory('海藻其他')" class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap">🌿 其他</button>
        </div>
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-slate-400 text-[10px]"></i>
          <input type="text" id="librarySearchInput" oninput="renderLibrary()" placeholder="搜尋食材名稱..." class="w-full pl-7 pr-2.5 py-1 border border-slate-300 rounded-lg text-xs bg-slate-50 focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500">
        </div>
      </div>
      <div id="libraryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2"></div>
    </section>

  </main>

  <!-- 彈窗 Modal -->
  <div id="mealModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-2.5 hidden">
    <div class="bg-white rounded-3xl max-w-3xl w-full max-h-[95vh] overflow-y-auto custom-scrollbar shadow-2xl border border-slate-100">
      
      <div class="p-3.5 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
        <h3 class="font-bold text-slate-800 text-base flex items-center gap-1"><span>🍲</span> <span id="modalHeaderLabel">紀錄餐點食材</span></h3>
        <button onclick="closeMealModal()" class="text-slate-400 hover:text-slate-600 w-7 h-7 rounded-full flex items-center justify-center hover:bg-slate-100 transition-all"><i class="fa-solid fa-xmark text-base"></i></button>
      </div>

      <form id="mealForm" onsubmit="handleMealSubmit(event)" class="p-3.5 sm:p-5 space-y-3">
        <input type="hidden" id="editingMealId" value="">

        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-0.5">日期</label>
            <input type="date" id="mealDate" required class="w-full border border-slate-300 rounded-lg px-2 py-1 text-xs bg-slate-50 focus:bg-white focus:ring-1 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-0.5">時間</label>
            <input type="time" id="mealTime" value="12:00" required class="w-full border border-slate-300 rounded-lg px-2 py-1 text-xs bg-slate-50 focus:bg-white focus:ring-1 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-0.5">餐別</label>
            <select id="mealType" class="w-full border border-slate-300 rounded-lg px-2 py-1 text-xs bg-slate-50 focus:bg-white focus:ring-1 focus:ring-emerald-500">
              <option value="早餐">🥣 早餐</option>
              <option value="早點心">🍎 早點心</option>
              <option value="午餐" selected>🍱 午餐</option>
              <option value="下午茶">🍪 下午茶</option>
              <option value="晚餐">🍲 晚餐</option>
              <option value="晚點心">🥛 晚點心</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-0.5">食用總量 (g/ml)</label>
            <input type="number" id="mealWeight" placeholder="例：80" class="w-full border border-slate-300 rounded-lg px-2 py-1 text-xs bg-slate-50 focus:bg-white focus:ring-1 focus:ring-emerald-500">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">選擇食用食材</label>
          <div class="relative mb-1.5">
            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-slate-400 text-[10px]"></i>
            <input type="text" id="pickerSearchInput" oninput="renderPickerChips()" placeholder="🔍 關鍵字搜尋..." class="w-full pl-7 pr-2.5 py-1 border border-slate-300 rounded-lg text-xs bg-slate-50 focus:bg-white focus:ring-1 focus:ring-emerald-500">
          </div>

          <div class="flex gap-1 overflow-x-auto pb-0.5 mb-1.5 custom-scrollbar text-xs">
            <button type="button" onclick="switchPickerCategory('穀物澱粉')" class="px-2 py-0.5 rounded-md bg-emerald-600 text-white font-bold whitespace-nowrap text-[11px]">🌾 穀物</button>
            <button type="button" onclick="switchPickerCategory('蔬菜菌菇')" class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap text-[11px]">🥦 蔬菜</button>
            <button type="button" onclick="switchPickerCategory('水果')" class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap text-[11px]">🍎 水果</button>
            <button type="button" onclick="switchPickerCategory('蛋豆魚肉乳')" class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap text-[11px]">🥩 蛋白</button>
            <button type="button" onclick="switchPickerCategory('海藻其他')" class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap text-[11px]">🌿 其他</button>
            <button type="button" onclick="switchPickerCategory('unlocked')" class="px-2 py-0.5 rounded-md bg-amber-100 text-amber-900 font-bold whitespace-nowrap text-[11px]">✨ 解鎖</button>
          </div>

          <div id="pickerChipsContainer" class="flex flex-wrap gap-1 p-2 bg-slate-50 rounded-xl border border-slate-200 max-h-32 overflow-y-auto custom-scrollbar"></div>
        </div>

        <div class="bg-emerald-50/60 p-2.5 rounded-xl border border-emerald-100 space-y-1.5">
          <div class="text-[11px] font-bold text-emerald-900 flex items-center justify-between">
            <span>已選擇食材：</span>
            <span id="selectedIngredientsCount" class="text-emerald-700 font-semibold">0 項</span>
          </div>
          <div id="selectedIngredientsList" class="space-y-1.5 min-h-[20px]"></div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-0.5">食材形態 / 質地</label>
          <select id="mealTexture" class="w-full border border-slate-300 rounded-lg px-2 py-1 text-xs bg-slate-50 focus:bg-white focus:ring-1 focus:ring-emerald-500">
            <option value="十倍粥 / 米湯" selected>🥣 十倍粥 / 米湯</option>
            <option value="七倍粥 / 濃粥">🥣 七倍粥 / 濃粥</option>
            <option value="五倍粥 / 軟飯">🍚 五倍粥 / 軟飯</option>
            <option value="泥狀 / 糊狀">🥑 泥狀 / 糊狀</option>
            <option value="細碎 / 顆粒狀">🥕 細碎 / 顆粒狀</option>
            <option value="剪小塊 / 條狀">🍌 剪小塊 / 條狀（手指食物）</option>
            <option value="原型食物 / 蒸熟">🥦 原型食物 / 蒸熟</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-0.5">備註 / 觀察心得（選填）</label>
          <textarea id="mealNotes" rows="2" placeholder="例：皮膚無紅疹、大便正常..." class="w-full border border-slate-300 rounded-lg px-2 py-1 text-xs bg-slate-50 focus:bg-white focus:ring-1 focus:ring-emerald-500"></textarea>
        </div>

        <div class="flex gap-2 pt-1 border-t border-slate-100">
          <button type="button" onclick="closeMealModal()" class="flex-1 bg-slate-100 text-slate-600 py-2 rounded-xl font-bold hover:bg-slate-200 text-xs">取消</button>
          <button type="submit" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-bold hover:bg-emerald-700 text-xs shadow-xs" id="submitMealBtnLabel">儲存餐點紀錄</button>
        </div>
      </form>

    </div>
  </div>

      { name: '豬絞肉', category: '蛋豆魚肉乳', icon: '🥩' },
      { name: '牛絞肉', category: '蛋豆魚肉乳', icon: '🥩' },
      { name: '鮭魚', category: '蛋豆魚肉乳', icon: '🐟' },
      { name: '鱸魚', category: '蛋豆魚肉乳', icon: '🐟' },
      { name: '鱈魚', category: '蛋豆魚肉乳', icon: '🐟' },
      { name: '魩仔魚', category: '蛋豆魚肉乳', icon: '🐟' },
      { name: '蝦仁', category: '蛋豆魚肉乳', icon: '🦐' },
      { name: '黑芝麻粉', category: '海藻其他', icon: '🖤' },
      { name: '橄欖油', category: '海藻其他', icon: '🫒' },
      { name: '高湯', category: '海藻其他', icon: '🍲' }
    ];

    let appData = { syncCode: 'huehue', meals: [], foods: DEFAULT_FOOD_DATABASE, foodStatus: {} };
    let selectedMealIngredients = [];
    let activePickerCategory = '穀物澱粉';
    let activeLibraryCategory = 'all';
    let calendarCurrentDate = new Date();

    window.onload = function() {
      loadLocalData();
      resetDailyDateToToday();
      renderPickerChips();
      renderLibrary();
      updateBadges();

      initFirebaseListener();
    };

    /* 計算每個食材在全站紀錄中最早出現的日期 */
    function getEarliestDateMap() {
      const map = {};
      const sortedMeals = [...appData.meals].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      sortedMeals.forEach(m => {
        (m.ingredients || []).forEach(i => {
          const ingName = typeof i === 'string' ? i : i.name;
          if (!map[ingName]) {
            map[ingName] = m.date;
          }
        });
      });
      return map;
    }

    function initFirebaseListener() {
      if (!window.firebaseInitialized) {
        setTimeout(initFirebaseListener, 500);
        return;
      }
      const syncRef = window.dbRef(window.db, 'baby_food_' + appData.syncCode);
      
      window.dbOnValue(syncRef, (snapshot) => {
        const val = snapshot.val();
        if (val) {
          appData.meals = val.meals || [];
          appData.foodStatus = val.foodStatus || {};
          if (val.foods && val.foods.length >= 20) appData.foods = val.foods;
          localStorage.setItem('baby_food_app_data', JSON.stringify(appData));
          
          renderDailyCards();
          renderCalendar();
          renderLibrary();
          updateBadges();
        }
        document.getElementById('cloudStatusBadge').className = "bg-emerald-100 text-emerald-800 text-[9px] px-1.5 py-0.5 rounded font-bold";
        document.getElementById('cloudStatusBadge').innerText = "✓ 雲端已即時同步";
      }, (error) => {
        console.error("Firebase error:", error);
        document.getElementById('cloudStatusBadge').className = "bg-rose-100 text-rose-800 text-[9px] px-1.5 py-0.5 rounded font-bold";
        document.getElementById('cloudStatusBadge').innerText = "⚠️ 權限受限";
      });
    }

    function loadLocalData() {
      const saved = localStorage.getItem('baby_food_app_data');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.syncCode) appData.syncCode = parsed.syncCode;
          if (parsed.meals) appData.meals = parsed.meals;
          if (parsed.foodStatus) appData.foodStatus = parsed.foodStatus;
          if (parsed.foods && parsed.foods.length >= 20) appData.foods = parsed.foods;
        } catch (e) {}
      }
      document.getElementById('syncCodeDisplay').innerText = appData.syncCode;
    }

    function saveData() {
      localStorage.setItem('baby_food_app_data', JSON.stringify(appData));
      updateBadges();

      if (window.firebaseInitialized) {
        const syncRef = window.dbRef(window.db, 'baby_food_' + appData.syncCode);
        window.dbSet(syncRef, appData);
      }
    }

    function shiftDailyDate(offsetDays) {
      const input = document.getElementById('dailyDateFilter');
      const dateObj = new Date(input.value || new Date());
      dateObj.setDate(dateObj.getDate() + offsetDays);
      input.value = dateObj.toISOString().split('T')[0];
      renderDailyCards();
    }

    function resetDailyDateToToday() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dailyDateFilter').value = today;
      document.getElementById('mealDate').value = today;
      renderDailyCards();
    }

    function renderDailyCards() {
      const container = document.getElementById('dailyCardsContainer');
      const targetDate = document.getElementById('dailyDateFilter').value;
      const todayStr = new Date().toISOString().split('T')[0];
      const earliestMap = getEarliestDateMap();

      document.getElementById('btnJumpToToday').classList.toggle('hidden', targetDate === todayStr);

      const dayMeals = appData.meals.filter(m => m.date === targetDate);
      dayMeals.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

      if (dayMeals.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-5 text-center border border-slate-200 text-slate-400 space-y-2">
            <div class="text-2xl">🥣</div>
            <p class="font-medium text-xs text-slate-600">${targetDate} 尚無副食品紀錄</p>
            <button onclick="openMealModal(null, '${targetDate}')" class="bg-emerald-600 text-white px-3 py-1 rounded-lg text-xs font-bold shadow-xs hover:bg-emerald-700">+ 新增餐點</button>
          </div>`;
        return;
      }

      let html = '';
      dayMeals.forEach(meal => {
        let ingredientsChipsHtml = (meal.ingredients || []).map(item => {
          const ingName = typeof item === 'string' ? item : item.name;
          const isFirstEverOccur = earliestMap[ingName] === meal.date;
          const foodObj = appData.foods.find(f => f.name === ingName) || {};
          const status = appData.foodStatus[ingName] || 'normal';

          let statusTag = '';
          if (status === 'like') statusTag = '<span class="text-[9px] text-rose-600 font-bold ml-0.5">❤️</span>';
          else if (status === 'dislike') statusTag = '<span class="text-[9px] text-amber-700 font-bold ml-0.5">🤢</span>';
          else if (status === 'allergy') statusTag = '<span class="bg-rose-600 text-black text-[9px] font-black px-1 py-0.2 rounded ml-0.5">❌過敏</span>';

          return `
            <div class="inline-flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-xs">
              <span>${foodObj.icon || '🥦'}</span>
              <span class="font-bold text-slate-800">${escapeHtml(ingName)}</span>
              ${isFirstEverOccur ? '<span class="bg-amber-400 text-slate-900 font-extrabold text-[8px] px-1 rounded">新嘗試</span>' : ''}
              ${statusTag}
            </div>`;
        }).join('');

        html += `
          <div class="bg-white rounded-2xl p-3 border border-slate-200 shadow-xs space-y-2">
            <div class="flex items-center justify-between border-b border-slate-100 pb-1.5">
              <div class="flex items-center gap-1.5">
                <span class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-md font-bold">${meal.type || '餐點'}</span>
                <span class="text-slate-500 font-semibold text-[11px]"><i class="fa-regular fa-clock text-[9px]"></i> ${meal.time || '--:--'}</span>
                ${meal.weight ? `<span class="text-slate-400 text-[10px]">（${meal.weight} g/ml）</span>` : ''}
              </div>
              <div class="flex items-center gap-1">
                <button onclick="editMeal('${meal.id}')" class="text-slate-400 hover:text-emerald-600 p-1" title="編輯"><i class="fa-solid fa-pen-to-square text-[11px]"></i></button>
                <button onclick="deleteMeal('${meal.id}')" class="text-slate-400 hover:text-rose-600 p-1" title="刪除"><i class="fa-solid fa-trash-can text-[11px]"></i></button>
              </div>
            </div>

            <div class="flex flex-wrap gap-1.5">${ingredientsChipsHtml}</div>

            ${(meal.texture || meal.notes) ? `
              <div class="bg-slate-50 px-2 py-1 rounded-lg border border-slate-100 text-[10px] text-slate-600 flex flex-wrap items-center gap-2">
                ${meal.texture ? `<span><b>質地:</b> ${escapeHtml(meal.texture)}</span>` : ''}
                ${meal.notes ? `<span class="truncate"><b>備註:</b> ${escapeHtml(meal.notes)}</span>` : ''}
              </div>` : ''}
          </div>`;
      });

      container.innerHTML = html;
    }

    function switchView(viewName) {
      document.getElementById('viewDaily').classList.add('hidden');
      document.getElementById('viewCalendar').classList.add('hidden');
      document.getElementById('viewLibrary').classList.add('hidden');

      document.getElementById('viewBtnDaily').className = "px-3 sm:px-4 py-1 rounded-lg transition-all flex items-center gap-1 text-slate-600 hover:text-slate-900";
      document.getElementById('viewBtnCalendar').className = "px-3 sm:px-4 py-1 rounded-lg transition-all flex items-center gap-1 text-slate-600 hover:text-slate-900";
      document.getElementById('viewBtnLibrary').className = "px-3 sm:px-4 py-1 rounded-lg transition-all flex items-center gap-1 text-slate-600 hover:text-slate-900";

      if (viewName === 'daily') {
        document.getElementById('viewDaily').classList.remove('hidden');
        document.getElementById('viewBtnDaily').className = "px-3 sm:px-4 py-1 rounded-lg transition-all flex items-center gap-1 bg-white shadow-xs text-emerald-700 font-semibold";
        renderDailyCards();
      } else if (viewName === 'calendar') {
        document.getElementById('viewCalendar').classList.remove('hidden');
        document.getElementById('viewBtnCalendar').className = "px-3 sm:px-4 py-1 rounded-lg transition-all flex items-center gap-1 bg-white shadow-xs text-emerald-700 font-semibold";
        renderCalendar();
      } else if (viewName === 'library') {
        document.getElementById('viewLibrary').classList.remove('hidden');
        document.getElementById('viewBtnLibrary').className = "px-3 sm:px-4 py-1 rounded-lg transition-all flex items-center gap-1 bg-white shadow-xs text-emerald-700 font-semibold";
        renderLibrary();
      }
    }

    /* 渲染月日曆：全自動判斷食材「首次出現」才顯示「新」標籤 */
    function renderCalendar() {
      const year = calendarCurrentDate.getFullYear();
      const month = calendarCurrentDate.getMonth();
      document.getElementById('calendarMonthTitle').innerText = `${year} 年 ${month + 1} 月`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const earliestMap = getEarliestDateMap();

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="bg-slate-50/40 rounded-xl min-h-[85px]"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayMeals = appData.meals.filter(m => m.date === dateStr);

        let mealsListHtml = dayMeals.map(m => {
          const ingsHtml = (m.ingredients || []).map(i => {
            const ingName = typeof i === 'string' ? i : i.name;
            const isFirstEverOccur = earliestMap[ingName] === dateStr;
            const status = appData.foodStatus[ingName] || 'normal';

            if (status === 'allergy') {
              return `<span class="bg-rose-500 text-black font-black px-1 py-0.2 rounded text-[8px] inline-flex items-center border border-rose-700">❌${escapeHtml(ingName)}</span>`;
            } else if (isFirstEverOccur) {
              return `<span class="bg-amber-100 text-amber-900 border border-amber-300 font-bold px-1 py-0.2 rounded text-[9px] inline-flex items-center"><span class="bg-emerald-600 text-white rounded px-0.5 mr-0.5 text-[7px]">新</span>${escapeHtml(ingName)}</span>`;
            } else {
              return `<span class="text-slate-800 font-medium text-[9px]">${escapeHtml(ingName)}</span>`;
            }
          }).join('、');

          return `<div class="text-[9px] bg-slate-100 p-0.5 rounded border border-slate-200 flex flex-wrap items-center gap-0.5"><span class="font-bold text-slate-500">${m.type}:</span> ${ingsHtml}</div>`;
        }).join('');

        const isToday = dateStr === new Date().toISOString().split('T')[0];
        grid.innerHTML += `
          <div onclick="jumpToDateFromCalendar('${dateStr}')" class="bg-white rounded-xl border ${isToday ? 'border-emerald-500 ring-2 ring-emerald-200' : 'border-slate-200'} p-1 min-h-[85px] cursor-pointer">
            <div class="border-b border-slate-100 pb-0.5"><span class="text-[9px] font-bold ${isToday ? 'bg-emerald-600 text-white rounded-full w-3.5 h-3.5 flex items-center justify-center' : 'text-slate-700'}">${d}</span></div>
            <div class="space-y-0.5 overflow-y-auto mt-0.5 max-h-16 custom-scrollbar">${mealsListHtml}</div>
          </div>`;
      }
    }

    function changeMonth(delta) {
      calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() + delta);
      renderCalendar();
    }

    function jumpToDateFromCalendar(dateStr) {
      document.getElementById('dailyDateFilter').value = dateStr;
      switchView('daily');
    }

    function renderLibrary() {
      const grid = document.getElementById('libraryGrid');
      const searchKeyword = document.getElementById('librarySearchInput').value.trim().toLowerCase();

      const triedIngredients = new Set();
      appData.meals.forEach(m => (m.ingredients || []).forEach(i => triedIngredients.add(typeof i === 'string' ? i : i.name)));

      let allergyCount = 0;
      Object.values(appData.foodStatus).forEach(s => { if (s === 'allergy') allergyCount++; });

      let list = appData.foods;
      if (activeLibraryCategory !== 'all') list = list.filter(f => f.category === activeLibraryCategory);
      if (searchKeyword) list = list.filter(f => f.name.toLowerCase().includes(searchKeyword));

      document.getElementById('unlockedStatsText').innerText = `解鎖 ${triedIngredients.size} / ${appData.foods.length} 種`;
      document.getElementById('allergyStatsText').innerText = `❌ 過敏 ${allergyCount} 種`;

      grid.innerHTML = list.map(food => {
        const isTried = triedIngredients.has(food.name);
        const status = appData.foodStatus[food.name] || 'normal';

        let statusIcon = '';
        if (status === 'like') statusIcon = '❤️ 喜愛';
        else if (status === 'dislike') statusIcon = '🤢 討厭';
        else if (status === 'allergy') statusIcon = '❌ 過敏';

        return `
          <div class="bg-white rounded-xl p-2 border ${status === 'allergy' ? 'border-rose-400 bg-rose-50/30' : 'border-slate-200'} shadow-xs flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <span class="text-lg">${food.icon || '🥦'}</span>
              <div>
                <div class="font-bold text-xs text-slate-800">${escapeHtml(food.name)}</div>
                <div class="text-[9px] ${isTried ? 'text-emerald-600 font-semibold' : 'text-slate-400'}">${isTried ? '✓ 解鎖' : '未解鎖'}</div>
              </div>
            </div>
            ${statusIcon ? `<span class="text-[9px] font-black px-1 py-0.2 rounded ${status === 'allergy' ? 'bg-rose-500 text-black border border-rose-700' : 'bg-slate-100 text-slate-700'}">${statusIcon}</span>` : ''}
          </div>`;
      }).join('');
    }

    function filterLibraryCategory(cat) {
      activeLibraryCategory = cat;
      renderLibrary();
    }

    function openMealModal(mealToEdit = null, presetDate = null) {
      document.getElementById('mealForm').reset();

      if (mealToEdit) {
        document.getElementById('modalHeaderLabel').innerText = '編輯餐點紀錄';
        document.getElementById('submitMealBtnLabel').innerText = '儲存修改內容';
        document.getElementById('editingMealId').value = mealToEdit.id;
        document.getElementById('mealDate').value = mealToEdit.date;
        document.getElementById('mealTime').value = mealToEdit.time || '12:00';
        document.getElementById('mealType').value = mealToEdit.type || '午餐';
        document.getElementById('mealWeight').value = mealToEdit.weight || '';
        document.getElementById('mealTexture').value = mealToEdit.texture || '十倍粥 / 米湯';
        document.getElementById('mealNotes').value = mealToEdit.notes || '';

        selectedMealIngredients = (mealToEdit.ingredients || []).map(item => {
          const ingName = typeof item === 'string' ? item : item.name;
          return { name: ingName };
        });
      } else {
        document.getElementById('modalHeaderLabel').innerText = '紀錄餐點食材';
        document.getElementById('submitMealBtnLabel').innerText = '儲存餐點紀錄';
        document.getElementById('editingMealId').value = '';
        document.getElementById('mealDate').value = presetDate || document.getElementById('dailyDateFilter').value || new Date().toISOString().split('T')[0];
        document.getElementById('mealTime').value = '12:00';
        selectedMealIngredients = [];
      }

      renderSelectedIngredientsList();
      renderPickerChips();
      document.getElementById('mealModal').classList.remove('hidden');
    }

    function editMeal(mealId) {
      const meal = appData.meals.find(m => m.id === mealId);
      if (meal) openMealModal(meal);
    }

    function closeMealModal() {
      document.getElementById('mealModal').classList.add('hidden');
    }

    function switchPickerCategory(cat) {
      activePickerCategory = cat;
      renderPickerChips();
    }

    function renderPickerChips() {
      const container = document.getElementById('pickerChipsContainer');
      const searchKey = document.getElementById('pickerSearchInput').value.trim();
      const searchKeyLower = searchKey.toLowerCase();
      const triedSet = new Set();
      appData.meals.forEach(m => (m.ingredients || []).forEach(i => triedSet.add(typeof i === 'string' ? i : i.name)));

      let filtered = appData.foods;
      if (searchKey) filtered = filtered.filter(f => f.name.toLowerCase().includes(searchKeyLower));
      else if (activePickerCategory === 'unlocked') filtered = filtered.filter(f => triedSet.has(f.name));
      else filtered = filtered.filter(f => f.category === activePickerCategory);

      let html = '';
      if (searchKey && !appData.foods.some(f => f.name.toLowerCase() === searchKeyLower)) {
        html += `<button type="button" onclick="addCustomFood('${escapeHtml(searchKey)}')" class="w-full mb-1 px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-600 text-white hover:bg-emerald-700">+ 新增「${escapeHtml(searchKey)}」至食材庫並選取</button>`;
      }

      html += filtered.map(food => {
        const isSelected = selectedMealIngredients.some(i => i.name === food.name);
        return `<button type="button" onclick="togglePickIngredient('${escapeHtml(food.name)}')" class="px-2 py-0.5 rounded-lg text-xs font-medium border flex items-center gap-1 ${isSelected ? 'bg-emerald-600 text-white font-bold' : 'bg-white text-slate-700 hover:bg-slate-100'}"><span>${food.icon || '🥦'}</span><span>${escapeHtml(food.name)}</span></button>`;
      }).join('');

      container.innerHTML = html;
    }

    function addCustomFood(name) {
      if (!name) return;
      if (!appData.foods.some(f => f.name === name)) {
        appData.foods.push({ name: name, category: '海藻其他', icon: '🍲' });
      }
      saveData();
      togglePickIngredient(name);
      document.getElementById('pickerSearchInput').value = '';
      renderPickerChips();
    }

    function togglePickIngredient(name) {
      const idx = selectedMealIngredients.findIndex(i => i.name === name);
      if (idx >= 0) {
        selectedMealIngredients.splice(idx, 1);
      } else {
        selectedMealIngredients.push({ name: name });
      }
      renderSelectedIngredientsList();
      renderPickerChips();
    }

    function renderSelectedIngredientsList() {
      const container = document.getElementById('selectedIngredientsList');
      document.getElementById('selectedIngredientsCount').innerText = `${selectedMealIngredients.length} 項`;
      
      container.innerHTML = selectedMealIngredients.map((item, index) => {
        const currentStatus = appData.foodStatus[item.name] || 'normal';
        return `
          <div class="bg-white border border-slate-200 rounded-lg p-1.5 space-y-1 text-xs shadow-2xs">
            <div class="flex items-center justify-between">
              <span class="font-bold text-xs text-slate-800">${escapeHtml(item.name)}</span>
            </div>
            <div class="flex items-center gap-0.5 pt-0.5 border-t border-slate-100 text-[10px]">
              <span class="text-slate-500 font-medium">試敏:</span>
              <button type="button" onclick="setFoodStatus('${escapeHtml(item.name)}', 'like')" class="px-1 py-0.2 rounded border ${currentStatus === 'like' ? 'bg-rose-100 border-rose-400 text-rose-800 font-bold' : 'bg-slate-50 text-slate-600'}">❤️ 喜歡</button>
              <button type="button" onclick="setFoodStatus('${escapeHtml(item.name)}', 'normal')" class="px-1 py-0.2 rounded border ${currentStatus === 'normal' ? 'bg-slate-200 border-slate-400 text-slate-800 font-bold' : 'bg-slate-50 text-slate-600'}">😐 普通</button>
              <button type="button" onclick="setFoodStatus('${escapeHtml(item.name)}', 'dislike')" class="px-1 py-0.2 rounded border ${currentStatus === 'dislike' ? 'bg-amber-100 border-amber-400 text-amber-900 font-bold' : 'bg-slate-50 text-slate-600'}">🤢 討厭</button>
              <button type="button" onclick="setFoodStatus('${escapeHtml(item.name)}', 'allergy')" class="px-1 py-0.2 rounded border ${currentStatus === 'allergy' ? 'bg-rose-600 text-black font-extrabold border border-rose-800' : 'bg-slate-50 text-rose-600 border-rose-200'}">❌ 過敏</button>
            </div>
          </div>`;
      }).join('');
    }

    function setFoodStatus(foodName, status) {
      appData.foodStatus[foodName] = status;
      saveData();
      renderSelectedIngredientsList();
      renderDailyCards();
      renderCalendar();
    }

    function handleMealSubmit(e) {
      e.preventDefault();
      if (selectedMealIngredients.length === 0) {
        alert('請至少選擇一種食材！');
        return;
      }

      const editingId = document.getElementById('editingMealId').value;
      const mealData = {
        id: editingId || ('meal_' + Date.now()),
        date: document.getElementById('mealDate').value,
        time: document.getElementById('mealTime').value,
        type: document.getElementById('mealType').value,
        weight: document.getElementById('mealWeight').value.trim(),
        texture: document.getElementById('mealTexture').value,
        notes: document.getElementById('mealNotes').value.trim(),
        ingredients: selectedMealIngredients.map(i => ({ name: i.name }))
      };

      if (editingId) {
        const index = appData.meals.findIndex(m => m.id === editingId);
        if (index >= 0) appData.meals[index] = mealData;
      } else {
        appData.meals.push(mealData);
      }

      saveData();
      closeMealModal();
      document.getElementById('dailyDateFilter').value = mealData.date;
      renderDailyCards();
      renderCalendar();
    }

    function deleteMeal(id) {
      if (confirm('確定要刪除這筆餐點紀錄嗎？')) {
        appData.meals = appData.meals.filter(m => m.id !== id);
        saveData();
        renderDailyCards();
        renderCalendar();
      }
    }

    function updateBadges() {
      const triedSet = new Set();
      appData.meals.forEach(m => (m.ingredients || []).forEach(i => triedSet.add(typeof i === 'string' ? i : i.name)));
      document.getElementById('libraryCountBadge').innerText = triedSet.size;
    }

    function promptChangeSyncCode() {
      const code = prompt('請輸入您的家庭同步碼（例如：huehue）：', appData.syncCode);
      if (code && code.trim()) {
        appData.syncCode = code.trim();
        document.getElementById('syncCodeDisplay').innerText = appData.syncCode;
        saveData();
        initFirebaseListener();
      }
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : '';
    }
  </script>
</body>
</html>
